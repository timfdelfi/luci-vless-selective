# Запасные стратегии обхода Discord для nfqws. Основной набор vless-discord собирает сам из
# файлов general*.bat в релизе Flowseal (обновляется вместе с ним); эти используются после него,
# если релиз недоступен или его .bat-файлы не удалось разобрать.
# Формат: id|описание|профили nfqws (через --new)
# @F@ — каталог с .bin-фейками Flowseal, @L@ — список доменов Discord. Стратегия, которой не
# хватает .bin-файла, пропускается. Порядок = порядок перебора.
s1|multisplit + seqovl (как general)|--filter-tcp=443 --hostlist=@L@ --dpi-desync=multisplit --dpi-desync-split-seqovl=681 --dpi-desync-split-pos=1 --dpi-desync-split-seqovl-pattern=@F@/tls_clienthello_www_google_com.bin --new --filter-tcp=2053,2083,2087,2096,8443 --hostlist-domains=discord.media --dpi-desync=multisplit --dpi-desync-split-seqovl=681 --dpi-desync-split-pos=1 --dpi-desync-split-seqovl-pattern=@F@/tls_clienthello_www_google_com.bin --new --filter-udp=19294-19344,50000-50100 --filter-l7=discord,stun --dpi-desync=fake --dpi-desync-fake-discord=@F@/quic_initial_www_google_com.bin --dpi-desync-fake-stun=@F@/quic_initial_www_google_com.bin --dpi-desync-repeats=6
s2|multisplit + seqovl, голос dbankcloud|--filter-tcp=443 --hostlist=@L@ --dpi-desync=multisplit --dpi-desync-split-seqovl=652 --dpi-desync-split-pos=2 --dpi-desync-split-seqovl-pattern=@F@/tls_clienthello_www_google_com.bin --new --filter-tcp=2053,2083,2087,2096,8443 --hostlist-domains=discord.media --dpi-desync=multisplit --dpi-desync-split-seqovl=652 --dpi-desync-split-pos=2 --dpi-desync-split-seqovl-pattern=@F@/tls_clienthello_www_google_com.bin --new --filter-udp=19294-19344,50000-50100 --filter-l7=discord,stun --dpi-desync=fake --dpi-desync-fake-discord=@F@/quic_initial_dbankcloud_ru.bin --dpi-desync-fake-stun=@F@/quic_initial_dbankcloud_ru.bin --dpi-desync-repeats=6
s3|fake + multisplit, badseq, голос dbankcloud|--filter-tcp=443 --hostlist=@L@ --dpi-desync=fake,multisplit --dpi-desync-repeats=6 --dpi-desync-fooling=badseq --dpi-desync-badseq-increment=1000 --dpi-desync-fake-tls=@F@/tls_clienthello_www_google_com.bin --new --filter-tcp=2053,2083,2087,2096,8443 --hostlist-domains=discord.media --dpi-desync=fake,multisplit --dpi-desync-repeats=6 --dpi-desync-fooling=badseq --dpi-desync-badseq-increment=1000 --dpi-desync-fake-tls=@F@/tls_clienthello_www_google_com.bin --new --filter-udp=19294-19344,50000-50100 --filter-l7=discord,stun --dpi-desync=fake --dpi-desync-fake-discord=@F@/quic_initial_dbankcloud_ru.bin --dpi-desync-fake-stun=@F@/quic_initial_dbankcloud_ru.bin --dpi-desync-repeats=6
s4|multisplit sniext (как ALT7)|--filter-tcp=443 --hostlist=@L@ --dpi-desync=multisplit --dpi-desync-split-pos=2,sniext+1 --dpi-desync-split-seqovl=679 --dpi-desync-split-seqovl-pattern=@F@/tls_clienthello_www_google_com.bin --new --filter-tcp=2053,2083,2087,2096,8443 --hostlist-domains=discord.media --dpi-desync=multisplit --dpi-desync-split-pos=2,sniext+1 --dpi-desync-split-seqovl=679 --dpi-desync-split-seqovl-pattern=@F@/tls_clienthello_www_google_com.bin --new --filter-udp=19294-19344,50000-50100 --filter-l7=discord,stun --dpi-desync=fake --dpi-desync-fake-discord=@F@/quic_initial_www_google_com.bin --dpi-desync-fake-stun=@F@/quic_initial_www_google_com.bin --dpi-desync-repeats=6
s5|fake + fakedsplit, ts|--filter-tcp=443 --hostlist=@L@ --dpi-desync=fake,fakedsplit --dpi-desync-repeats=6 --dpi-desync-fooling=ts --dpi-desync-fakedsplit-pattern=0x00 --dpi-desync-fake-tls=@F@/tls_clienthello_www_google_com.bin --new --filter-tcp=2053,2083,2087,2096,8443 --hostlist-domains=discord.media --dpi-desync=fake,fakedsplit --dpi-desync-repeats=6 --dpi-desync-fooling=ts --dpi-desync-fakedsplit-pattern=0x00 --dpi-desync-fake-tls=@F@/tls_clienthello_www_google_com.bin --new --filter-udp=19294-19344,50000-50100 --filter-l7=discord,stun --dpi-desync=fake --dpi-desync-repeats=6
s6|hostfakesplit (www.google.com)|--filter-tcp=443 --hostlist=@L@ --dpi-desync=hostfakesplit --dpi-desync-fooling=ts --dpi-desync-hostfakesplit-mod=host=www.google.com --new --filter-tcp=2053,2083,2087,2096,8443 --hostlist-domains=discord.media --dpi-desync=hostfakesplit --dpi-desync-fooling=ts --dpi-desync-hostfakesplit-mod=host=www.google.com --new --filter-udp=19294-19344,50000-50100 --filter-l7=discord,stun --dpi-desync=fake --dpi-desync-repeats=6
s7|fake + multidisorder, md5sig|--filter-tcp=443 --hostlist=@L@ --dpi-desync=fake,multidisorder --dpi-desync-split-pos=midsld --dpi-desync-repeats=11 --dpi-desync-fooling=md5sig --new --filter-tcp=2053,2083,2087,2096,8443 --hostlist-domains=discord.media --dpi-desync=fake,multidisorder --dpi-desync-split-pos=midsld --dpi-desync-repeats=11 --dpi-desync-fooling=md5sig --new --filter-udp=19294-19344,50000-50100 --filter-l7=discord,stun --dpi-desync=fake --dpi-desync-repeats=11
s8|multidisorder без фейков|--filter-tcp=443 --hostlist=@L@ --dpi-desync=multidisorder --dpi-desync-split-pos=1,midsld --new --filter-tcp=2053,2083,2087,2096,8443 --hostlist-domains=discord.media --dpi-desync=multidisorder --dpi-desync-split-pos=1,midsld --new --filter-udp=19294-19344,50000-50100 --filter-l7=discord,stun --dpi-desync=fake --dpi-desync-repeats=6
